<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verifikasi - Website Portofolio</title>
  <!-- Google reCAPTCHA API -->
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0f172a;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .login-box {
      background: #1e293b;
      padding: 2.5rem;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 380px;
    }
    .login-box h2 {
      margin-bottom: 0.5rem;
    }
    .login-box p {
      color: #94a3b8;
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
    }
    .recaptcha-container {
      display: flex;
      justify-content: center;
      margin-bottom: 1.5rem;
    }
    .btn-masuk {
      background: #2563eb;
      color: white;
      border: none;
      padding: 12px 20px;
      width: 100%;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s;
    }
    .btn-masuk:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>

  <div class="login-box">
    <h2>Akses Terbatas</h2>
    <p>Selesaikan verifikasi di bawah untuk masuk ke website.</p>
    
    <!-- Widget Centang "Saya bukan robot" -->
    <div class="recaptcha-container">
      <div class="g-recaptcha" data-sitekey="6LeIxAcTAAAAAJcZVRqyHh71UMIEGNQ_MXjiZKhI"></div>
    </div>

    <!-- Tombol Masuk -->
    <button class="btn-masuk" onclick="cekVerifikasi()">Masuk ke Website</button>
  </div>

  <script>
    function cekVerifikasi() {
      var response = grecaptcha.getResponse();

      if (response.length === 0) {
        alert("Mohon centang kotak 'Saya bukan robot' terlebih dahulu!");
      } else {
        // Simpan izin dan buka halaman portofolio (home.html)
        localStorage.setItem("sudahLogin", "true");
        window.location.href = "home.html";
      }
    }
  </script>

</body>
</html>
