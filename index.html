<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Website Portofolio</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0f172a;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .auth-box {
      background: #1e293b;
      padding: 2rem;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 380px;
    }
    .auth-box h2 { margin-bottom: 0.5rem; }
    .auth-box p { color: #94a3b8; font-size: 0.9rem; margin-bottom: 1.5rem; }
    .input-field {
      width: 100%;
      padding: 12px;
      margin-bottom: 1rem;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #fff;
      box-sizing: border-box;
    }
    .btn-submit {
      background: #2563eb;
      color: white;
      border: none;
      padding: 12px 20px;
      width: 100%;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 0.5rem;
    }
    .btn-submit:hover { background: #1d4ed8; }
    .link-text { margin-top: 1rem; font-size: 0.85rem; color: #94a3b8; }
    .link-text a { color: #38bdf8; text-decoration: none; }
  </style>
</head>
<body>

  <div class="auth-box">
    <h2>Selamat Datang</h2>
    <p>Silakan login untuk mengakses portofolio.</p>

    <input type="email" id="email" class="input-field" placeholder="Email Anda" required>
    <input type="password" id="password" class="input-field" placeholder="Password" required>
    
    <button class="btn-submit" onclick="loginAkun()">Masuk / Login</button>

    <div class="link-text">
      Belum punya akun? <a href="register.html">Daftar di sini</a>
    </div>
  </div>

  <!-- Firebase SDK Compat -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyByQSYmpYIPf82zxtko8-C2Lqo1T-Y6yi4",
      authDomain: "portofolio-login-f693e.firebaseapp.com",
      projectId: "portofolio-login-f693e",
      storageBucket: "portofolio-login-f693e.firebasestorage.app",
      messagingSenderId: "204650708306",
      appId: "1:204650708306:web:2939591eb57817a5f18e8b"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    function loginAkun() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      if (!email || !password) {
        alert("Mohon isi email dan password!");
        return;
      }

      auth.signInWithEmailAndPassword(email, password)
        .then((userCredential) => {
          localStorage.setItem("sudahLogin", "true");
          window.location.href = "home.html";
        })
        .catch((error) => {
          alert("Gagal Login: " + error.message);
        });
    }
  </script>
</body>
</html>
